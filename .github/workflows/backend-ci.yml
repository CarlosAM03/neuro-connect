name: Backend CI
on:
  pull_request:
  push:
    branches: [main, mvp0, mvp1, mvp2-avance1]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuroconnect_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neuroconnect_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neuroconnect_test
      JWT_EXPIRES_IN: 8h
      CORS_ORIGINS: http://localhost:5173
      PORT: 3000
      SWAGGER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run migrate:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: docker build -t neuroconnect-backend:ci .
