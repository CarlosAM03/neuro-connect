name: Frontend CI
on:
  pull_request:
  push:
    branches: [main, mvp0, mvp1, mvp2-avance1]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:3000/api/v1
      - run: docker build -t neuroconnect-frontend:ci .
